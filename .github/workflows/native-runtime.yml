name: Native Android runtime foundation

on:
  workflow_dispatch:
  push:
    branches: [native-android-no-azahar]
    paths:
      - "native/runtime/**"
      - ".github/workflows/native-runtime.yml"
      - "tools/recomp/runtime/recomp.h"

jobs:
  host-tests:
    name: Runtime ABI and memory tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Configure
        run: cmake -S native/runtime -B build/native-runtime -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native-runtime --parallel 2
      - name: Test
        run: ctest --test-dir build/native-runtime --output-on-failure
