name: Build private MH4U Android code library

on:
  workflow_dispatch:
    inputs:
      dump_url:
        description: "Temporary direct-download URL for YOUR decrypted USA v1.3.0 update CIA"
        required: true
        type: string
      optimization:
        description: "O0 compiles faster; O1 may run faster"
        required: true
        type: choice
        options: [O0, O1]
        default: O0

permissions:
  contents: read

jobs:
  build-code-library:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Android port
        uses: actions/checkout@v4
        with:
          ref: android-native-port
          path: port

      - name: Checkout upstream recompiler tools
        uses: actions/checkout@v4
        with:
          repository: klark231/MH4U-Android
          ref: main
          path: source

      - name: Validate source layout
        run: |
          set -euo pipefail
          test -f source/tools/build_game.py
          test -f source/config/versions.json
          test -f source/config/functions.tsv
          test -f port/port/src/arm_recomp.cpp -o -f port/port/README.md
          echo "Upstream recompiler source and port checkout verified."

      - name: Mask private dump URL
        env:
          DUMP_URL: ${{ inputs.dump_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DUMP_URL"
          test -n "$DUMP_URL"

      - name: Download own update dump privately
        env:
          DUMP_URL: ${{ inputs.dump_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mh4u-private"
          chmod 700 "$RUNNER_TEMP/mh4u-private"
          curl --fail --location --retry 2 --silent --show-error \
            "$DUMP_URL" --output "$RUNNER_TEMP/mh4u-private/update.cia"
          test -s "$RUNNER_TEMP/mh4u-private/update.cia"
          size=$(stat -c '%s' "$RUNNER_TEMP/mh4u-private/update.cia")
          if [ "$size" -lt 1048576 ]; then
            echo "::error::Downloaded file is too small; check the private URL."
            exit 1
          fi
          file "$RUNNER_TEMP/mh4u-private/update.cia"
          echo "UPDATE_CIA=$RUNNER_TEMP/mh4u-private/update.cia" >> "$GITHUB_ENV"

      - name: Install Python dependencies and Android NDK
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r source/requirements.txt
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Configure Android ARM64 compiler wrapper
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-cc"
          cat > "$RUNNER_TEMP/android-cc/aarch64-linux-android-clang" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" "$@"
          EOF
          chmod 700 "$RUNNER_TEMP/android-cc/aarch64-linux-android-clang"
          echo "ANDROID_CC=$RUNNER_TEMP/android-cc/aarch64-linux-android-clang" >> "$GITHUB_ENV"

      - name: Recompile update into Android ARM64 shared library
        working-directory: source
        env:
          OPT: ${{ inputs.optimization }}
        run: |
          set -euo pipefail
          python3 tools/build_game.py \
            --dump "$UPDATE_CIA" \
            --out "$RUNNER_TEMP/mh4u-private/build" \
            --cc "$ANDROID_CC" \
            --lib-ext so \
            --opt "$OPT" \
            -j 2
          LIB="$RUNNER_TEMP/mh4u-private/build/recomp/0004000000126300.so"
          test -s "$LIB"
          file "$LIB"
          readelf -h "$LIB" | grep -E 'Class:|Machine:'
          readelf -h "$LIB" | grep -q 'Class:.*ELF64'
          readelf -h "$LIB" | grep -q 'Machine:.*AArch64'
          mkdir -p "$RUNNER_TEMP/output"
          cp "$LIB" "$RUNNER_TEMP/output/0004000000126300.so"
          sha256sum "$RUNNER_TEMP/output/0004000000126300.so" > "$RUNNER_TEMP/output/SHA256SUMS.txt"
          printf '%s\n' "MH4U USA v1.3.0 Android ARM64 code library" > "$RUNNER_TEMP/output/README.txt"

      - name: Upload private build artifact (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: mh4u-code-library-android-arm64
          path: ${{ runner.temp }}/output/*
          retention-days: 1
          if-no-files-found: error

      - name: Remove private dump and generated game code
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/mh4u-private" "$RUNNER_TEMP/output"

  reject-public-repository:
    if: github.event.repository.private != true
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::This workflow generates a library containing game-derived code. Make the repository private before running it."
          exit 1
